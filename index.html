    const { useState, useEffect, useCallback, useRef } = React;

    // --- SOUND ENGINE (Web Audio API) ---
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playBid() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.08);
        } catch(e){}
      }
      playHammer() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        } catch(e){}
      }
      playCash() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(now + 0.25);
        } catch(e){}
      }
    }
    const audio = new SoundEngine();

    const AI_BIDDERS = [
      'Apex Constrictors', 'Royal Python Syndicate', 'Sub-Zero Morphs',
      'Vipera Prime', 'Scale & Clutch Collective', 'Dr. Vance Herpetology', 'Private Collector #44'
    ];

    // --- GENETICS RESOLUTION ---
    function resolveSpecimen(genotype, sex, age, weight, breeder, gen) {
      let visualGenes = [];
      let hets = [];
      let desc = [];
      let val = 150;

      // BEL complex
      const bel = genotype.find(g => g.locus === 'bel_complex');
      if (bel) {
        if (bel.a1 !== 'wt' && bel.a2 !== 'wt') {
          visualGenes.push('Blue-Eyed Leucistic (BEL)');
          desc.push('Pure snow-white unblemished scales with icy blue eyes.');
          val += 1800;
        } else {
          const act = bel.a1 !== 'wt' ? bel.a1 : bel.a2;
          if (act !== 'wt' && GENES[act]) { visualGenes.push(GENES[act].name); desc.push(GENES[act].desc); val += GENES[act].val; }
        }
      }

      // Cinnamon complex
      const cinny = genotype.find(g => g.locus === 'cinny_complex');
      let isSuperBlackPastel = false;
      if (cinny) {
        if (cinny.a1 === 'cinnamon' && cinny.a2 === 'cinnamon') { visualGenes.push('Super Cinnamon'); val += 1200; }
        else if (cinny.a1 === 'black_pastel' && cinny.a2 === 'black_pastel') { visualGenes.push('Super Black Pastel'); isSuperBlackPastel = true; val += 1400; }
        else if (cinny.a1 !== 'wt' && cinny.a2 !== 'wt') { visualGenes.push('Eight Ball'); val += 1600; }
        else {
          const act = cinny.a1 !== 'wt' ? cinny.a1 : cinny.a2;
          if (act !== 'wt' && GENES[act]) { visualGenes.push(GENES[act].name); desc.push(GENES[act].desc); val += GENES[act].val; }
        }
      }

      // Yellowbelly complex
      const yb = genotype.find(g => g.locus === 'yb_complex');
      if (yb) {
        if (yb.a1 === 'yellowbelly' && yb.a2 === 'yellowbelly') { visualGenes.push('Ivory'); val += 1100; }
        else if ((yb.a1 === 'yellowbelly' && yb.a2 === 'gravel') || (yb.a1 === 'gravel' && yb.a2 === 'yellowbelly')) { visualGenes.push('Highway'); desc.push('Hypnotic golden-orange broken vertebral freeway racing stripe bordered by purple flanks.'); val += 2400; }
        else {
          const act = yb.a1 !== 'wt' ? yb.a1 : yb.a2;
          if (act !== 'wt' && GENES[act]) { visualGenes.push(GENES[act].name); desc.push(GENES[act].desc); val += GENES[act].val; }
        }
      }

      // Fire complex
      const fire = genotype.find(g => g.locus === 'fire_complex');
      if (fire) {
        if (fire.a1 === 'fire' && fire.a2 === 'fire') { visualGenes.push('Super Fire (Black-Eyed Leucistic)'); desc.push('Snow white with solid obsidian black eyes.'); val += 1500; }
        else if (fire.a1 === 'fire' || fire.a2 === 'fire') { visualGenes.push('Fire'); val += GENES.fire.val; }
      }

      let isPied = false;
      genotype.forEach(p => {
        if (['bel_complex', 'cinny_complex', 'yb_complex', 'fire_complex'].includes(p.locus)) return;
        const act = p.a1 !== 'wt' ? p.a1 : p.a2;
        const def = GENES[act];
        if (!def) return;

        if (def.type === 'recessive') {
          if (p.a1 === p.a2 && p.a1 !== 'wt') {
            visualGenes.push(def.name);
            desc.push(def.desc);
            val += def.val * 2.2;
            if (def.id === 'piebald') isPied = true;
          } else if (p.a1 !== 'wt' || p.a2 !== 'wt') {
            hets.push({ gene: def.name, pct: p.possibleHet || 100 });
            val += def.val * 0.45;
          }
        } else if (def.type === 'codominant') {
          if (p.a1 === p.a2 && p.a1 !== 'wt') {
            visualGenes.push(def.superName);
            desc.push(`Super form: blinding expression of ${def.name}`);
            val += def.val * 3.5;
          } else if (p.a1 !== 'wt' || p.a2 !== 'wt') {
            visualGenes.push(def.name);
            desc.push(def.desc);
            val += def.val;
          }
        } else if (def.type === 'dominant') {
          if (p.a1 !== 'wt' || p.a2 !== 'wt') {
            visualGenes.push(def.name);
            desc.push(def.desc);
            val += def.val;
          }
        }
      });

      if (isSuperBlackPastel && isPied) {
        visualGenes = visualGenes.filter(g => g !== 'Super Black Pastel' && g !== 'Piebald');
        visualGenes.unshift('Panda Pied');
        desc.unshift('Pure high-white body accented by jet-black facial mask and dorsal saddles.');
        val += 4500;
      }

      let calcName = visualGenes.length ? visualGenes.join(' ') : 'Normal (Wild Type)';
      if (hets.length) {
        calcName += ' (' + hets.map(h => `${h.pct === 100 ? '100%' : h.pct + '%'} Het ${h.gene}`).join(' ') + ')';
      }

      let tier = 'Common';
      if (val >= 4000) tier = 'Grail';
      else if (val >= 2500) tier = 'Legendary';
      else if (val >= 1500) tier = 'Epic';
      else if (val >= 750) tier = 'Rare';
      else if (val >= 350) tier = 'Uncommon';

      return {
        id: 'ML-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
        name: calcName,
        sex,
        ageDays: age,
        weightGrams: weight,
        hunger: 100,
        shedStage: 'normal',
        genotype,
        breeder,
        generation: gen,
        baseValuation: Math.round(val),
        rarityTier: tier,
        phenotypeDescription: desc.join(' ') || 'Standard wild type dorsal rosettes with pearlescent belly scales.'
      };
    }

    // --- MAIN APP COMPONENT ---
    function MorphLabApp() {
      const [tab, setTab] = useState('facility');
      const [bank, setBank] = useState(5000);
      const [day, setDay] = useState(1);
      const [facilityTier, setFacilityTier] = useState(0);
      const [upgrades, setUpgrades] = useState([]);
      const [snakes, setSnakes] = useState([]);
      const [eggs, setEggs] = useState([]);
      const [freezer, setFreezer] = useState({ pinky_mouse: 20, fuzzy_mouse: 15, hopper_mouse: 10, adult_mouse: 8, rat_pup: 5, rat_weanling: 4, adult_rat: 2, jumbo_rat: 0 });
      const [isopods, setIsopods] = useState(ISOPODS);
      const [refreshTimer, setRefreshTimer] = useState(10);
      const [bargains, setBargains] = useState([]);
      const [trades, setTrades] = useState([]);

      // 10 Auction Lanes State
      const [lanes, setLanes] = useState(Array.from({ length: 10 }, (_, i) => ({
        id: i, active: false, snake: null, currentBid: 0, reserve: 0, highestBidder: 'None', timeLeft: 0, overtime: false
      })));

      // Starter Snakes Load
      useEffect(() => {
        const saved = localStorage.getItem('morphlab_save_v1');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            setBank(data.bank ?? 5000);
            setDay(data.day ?? 1);
            setFacilityTier(data.facilityTier ?? 0);
            setUpgrades(data.upgrades ?? []);
            setSnakes(data.snakes ?? []);
            setEggs(data.eggs ?? []);
            setFreezer(data.freezer ?? freezer);
            return;
          } catch(e){}
        }
        const s1 = resolveSpecimen([{ locus: 'pastel_locus', a1: 'pastel', a2: 'wt' }], 'M', 180, 750, 'MorphLab Starter', 0);
        const s2 = resolveSpecimen([{ locus: 'piebald_locus', a1: 'piebald', a2: 'wt' }], 'F', 240, 1600, 'MorphLab Starter', 0);
        setSnakes([s1, s2]);
      }, []);

      // Auto-save
      useEffect(() => {
        localStorage.setItem('morphlab_save_v1', JSON.stringify({ bank, day, facilityTier, upgrades, snakes, eggs, freezer }));
      }, [bank, day, facilityTier, upgrades, snakes, eggs, freezer]);

      // Dynamic Market Generators
      const regenMarket = useCallback(() => {
        const b = ['pastel', 'enchi', 'banana', 'fire', 'mojave', 'cinnamon'].map(g => {
          const s = resolveSpecimen([{ locus: `${g}_locus`, a1: g, a2: 'wt' }], Math.random() > 0.5 ? 'M' : 'F', 120, 300, 'Distressed Liquidator', 1);
          return { id: 'BGN-' + Math.random().toString(36).substring(2, 6), snake: s, discount: Math.floor(Math.random() * 35) + 25 };
        });
        setBargains(b.slice(0, 3));

        const tSnake = resolveSpecimen([{ locus: 'bel_complex', a1: 'mojave', a2: 'lesser' }], 'F', 180, 850, 'Vipera Prime', 1);
        setTrades([{
          id: 'TRD-1',
          breeder: 'Vipera Prime',
          criteria: 'Mature Piebald / Het Pied (≥500g)',
          minWeight: 500,
          reward: tSnake,
          cash: 450
        }]);
      }, []);

      // 1s Interval Game Loop
      useEffect(() => {
        const interval = setInterval(() => {
          setRefreshTimer(t => {
            if (t <= 1) { regenMarket(); return 10; }
            return t - 1;
          });

          // Update 10-Lane Auctions
          setLanes(curLanes => curLanes.map(l => {
            if (!l.active || !l.snake) return l;

            let { timeLeft, currentBid, highestBidder, overtime } = l;
            const isHype = l.snake.baseValuation >= 2000;
            const bidChance = isHype ? 0.65 : 0.35;

            if (Math.random() < bidChance && timeLeft > 0) {
              const newBidder = AI_BIDDERS[Math.floor(Math.random() * AI_BIDDERS.length)];
              if (newBidder !== highestBidder) {
                currentBid += Math.round(l.snake.baseValuation * 0.08) + 20;
                highestBidder = newBidder;
                if (timeLeft <= 10) { timeLeft += 15; overtime = true; }
                audio.playBid();
              }
            }

            timeLeft -= 1;

            if (timeLeft <= 0) {
              audio.playHammer();
              if (currentBid >= l.reserve) {
                const payout = Math.round(currentBid * 0.92); // 8% commission
                setBank(b => b + payout);
                audio.playCash();
              } else {
                setSnakes(s => [...s, l.snake]); // Unsold return
              }
              return { ...l, active: false, snake: null, timeLeft: 0, overtime: false };
            }

            return { ...l, timeLeft, currentBid, highestBidder, overtime };
          }));
        }, 1000);
        return () => clearInterval(interval);
      }, [regenMarket]);

      // Advance Day
      const nextDay = () => {
        setDay(d => d + 1);
        setEggs(curEggs => curEggs.map(e => ({ ...e, daysLeft: Math.max(0, e.daysLeft - (upgrades.includes('incubator_mod') ? 2 : 1)) })));
        setSnakes(curSnakes => curSnakes.map(s => {
          const hunger = Math.max(0, s.hunger - (Math.floor(Math.random() * 8) + 6));
          const weight = hunger > 40 ? s.weightGrams + (facilityTier >= 1 ? 3 : 2) : s.weightGrams;
          return { ...s, hunger, weightGrams: weight, ageDays: s.ageDays + 1 };
        }));
        if (upgrades.includes('autofeeder')) feedAll();
      };

      // Feeding
      const feedSnake = (id) => {
        const snake = snakes.find(s => s.id === id);
        if (!snake) return;
        const spec = FEEDER_SPECS.find(r => snake.weightGrams >= r.min && snake.weightGrams <= r.max) || FEEDER_SPECS[0];
        if ((freezer[spec.id] || 0) <= 0) {
          alert(`No ${spec.name} left in freezer!`);
          return;
        }
        setFreezer(f => ({ ...f, [spec.id]: f[spec.id] - 1 }));
        setSnakes(list => list.map(s => s.id === id ? { ...s, hunger: 100, weightGrams: s.weightGrams + spec.gain } : s));
      };

      const feedAll = () => snakes.filter(s => s.hunger < 50).forEach(s => feedSnake(s.id));

      // Consign to Auction
      const consignSnake = (snake) => {
        const openLane = lanes.find(l => !l.active);
        if (!openLane) { alert('All 10 auction lanes full!'); return; }
        setSnakes(s => s.filter(i => i.id !== snake.id));
        setLanes(curLanes => curLanes.map(l => l.id === openLane.id ? {
          ...l,
          active: true,
          snake,
          currentBid: Math.round(snake.baseValuation * 0.4),
          reserve: Math.round(snake.baseValuation * 0.75),
          highestBidder: 'Opening Reserve',
          timeLeft: 40,
          overtime: false
        } : l));
        setTab('auctions');
      };

      // Breeding
      const pairSnakes = (sireId, damId) => {
        const sire = snakes.find(s => s.id === sireId);
        const dam = snakes.find(s => s.id === damId);
        if (!sire || !dam) return;

        const count = Math.floor(Math.random() * 4) + 5;
        const newEggs = [];
        for (let i = 0; i < count; i++) {
          const eggGeno = [];
          const loci = new Set([...sire.genotype.map(g=>g.locus), ...dam.genotype.map(g=>g.locus)]);
          loci.forEach(loc => {
            const sp = sire.genotype.find(g => g.locus === loc) || { locus: loc, a1: 'wt', a2: 'wt' };
            const dp = dam.genotype.find(g => g.locus === loc) || { locus: loc, a1: 'wt', a2: 'wt' };
            const sAllele = Math.random() < 0.5 ? sp.a1 : sp.a2;
            const dAllele = Math.random() < 0.5 ? dp.a1 : dp.a2;
            eggGeno.push({ locus: loc, a1: sAllele, a2: dAllele });
          });
          newEggs.push({ id: 'EGG-' + Math.random().toString(36).substring(2, 7), geno: eggGeno, daysLeft: 60 });
        }
        setEggs(e => [...e, ...newEggs]);
        alert(`Copulation successful! ${count} fertile eggs placed in incubator.`);
        setTab('incubator');
      };

      // Export / Import JSON Saves
      const exportSave = () => {
        const payload = { app: 'MorphLab', day, bank, snakes, eggs, freezer, facilityTier, upgrades };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `morphlab_save_day${day}.json`;
        a.click();
      };

      const importSave = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = ev => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.snakes) setSnakes(d.snakes);
            if (d.bank) setBank(d.bank);
            if (d.day) setDay(d.day);
            if (d.eggs) setEggs(d.eggs);
            if (d.freezer) setFreezer(d.freezer);
            alert('Save restored!');
          } catch(err) { alert('Invalid file'); }
        };
        r.readAsText(file);
      };

      const maxCapacity = FACILITY_TIERS[facilityTier].cap;

      return (
        <div className="max-w-4xl mx-auto p-3 flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-slate-900 border border-slate-800 rounded-2xl p-3 mb-3 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center gap-2">
              <span className="text-2xl">🐍</span>
              <div>
                <h1 className="font-black text-sm tracking-wide text-white">MORPH<span className="text-emerald-400">LAB</span></h1>
                <div className="text-[10px] font-mono text-slate-400">Day {day} · {snakes.length}/{maxCapacity} Tubs</div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <div className="text-right mr-1">
                <div className="text-emerald-400 font-mono font-black text-sm">${bank.toLocaleString()}</div>
                <div className="text-[9px] text-slate-500 font-mono">CAPITAL</div>
              </div>
              <button onClick={nextDay} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg shadow">Next Day ▶</button>
              <button onClick={exportSave} className="p-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs" title="Save Backup">💾</button>
            </div>
          </header>

          {/* Navigation Bar */}
          <nav className="flex gap-1.5 overflow-x-auto pb-2 mb-3">
            {[
              { id: 'facility', label: 'Tubs', icon: '📦' },
              { id: 'breeding', label: 'Breed', icon: '🧬' },
              { id: 'incubator', label: `Eggs (${eggs.length})`, icon: '🥚' },
              { id: 'auctions', label: '10-Lane Auction', icon: '🔨' },
              { id: 'bargains', label: 'Bargains', icon: '🏷️' },
              { id: 'trades', label: 'Trades', icon: '🔄' },
              { id: 'feeders', label: 'Feeders', icon: '🐀' },
              { id: 'isopods', label: 'Isopods', icon: '✨' },
              { id: 'tech', label: 'Racks (600)', icon: '⚙️' }
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${
                  tab === t.id ? 'bg-emerald-600/30 text-emerald-300 border border-emerald-500/50' : 'bg-slate-900 text-slate-400 border border-slate-800'
                }`}
              >
                <span>{t.icon}</span> {t.label}
              </button>
            ))}
          </nav>

          {/* Content Views */}
          <main className="flex-1">
            {/* TUBS / ZERO-IMAGE DOSSIERS */}
            {tab === 'facility' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-xs">
                  <span className="font-mono text-slate-400">Specimen Racks</span>
                  <button onClick={feedAll} className="px-3 py-1 bg-cyan-600 text-white font-bold rounded-lg text-xs">⚡ Feed All Hungry</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {snakes.map(s => (
                    <div key={s.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${s.sex === 'F' ? 'bg-pink-950 text-pink-300' : 'bg-blue-950 text-blue-300'}`}>
                                {s.sex === 'F' ? '♀ FEMALE' : '♂ MALE'}
                              </span>
                              <span className="text-emerald-400 font-bold text-[10px]">{s.rarityTier}</span>
                            </div>
                            <h3 className="font-bold text-slate-100 text-sm mt-0.5">{s.name}</h3>
                          </div>
                          <div className="text-emerald-400 font-mono font-bold">${s.baseValuation.toLocaleString()}</div>
                        </div>

                        <div className="grid grid-cols-3 gap-1 bg-slate-950 p-2 rounded-lg font-mono text-center text-[10px] text-slate-300 mb-2">
                          <div>WEIGHT: <span className="font-bold text-white">{s.weightGrams}g</span></div>
                          <div>AGE: <span className="font-bold text-white">{s.ageDays}d</span></div>
                          <div>HUNGER: <span className={`font-bold ${s.hunger < 50 ? 'text-amber-400' : 'text-emerald-400'}`}>{s.hunger}%</span></div>
                        </div>

                        <div className="bg-slate-950/60 p-2 rounded-lg text-[11px] text-slate-300 italic mb-3">
                          "{s.phenotypeDescription}"
                        </div>
                      </div>

                      <div className="flex gap-2 pt-2 border-t border-slate-800">
                        <button onClick={() => feedSnake(s.id)} className="flex-1 py-1 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded">Feed</button>
                        <button onClick={() => consignSnake(s)} className="flex-1 py-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded">Consign</button>
                        <button onClick={() => {
                          const p = Math.round(s.baseValuation * 0.65);
                          setBank(b => b + p);
                          setSnakes(list => list.filter(i => i.id !== s.id));
                          audio.playCash();
                        }} className="px-2 py-1 bg-slate-800 text-slate-400 rounded hover:text-red-400">Sell</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* BREEDING LAB */}
            {tab === 'breeding' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs space-y-4">
                <h2 className="text-sm font-bold text-pink-400">Selective Mendelian Pairing</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="text-slate-400 block mb-1">SELECT SIRE (♂ ≥700g)</label>
                    <select id="sireSelect" className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-200">
                      <option value="">-- Choose Sire --</option>
                      {snakes.filter(s => s.sex === 'M' && s.weightGrams >= 700).map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.weightGrams}g)</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">SELECT DAM (♀ ≥1500g)</label>
                    <select id="damSelect" className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-200">
                      <option value="">-- Choose Dam --</option>
                      {snakes.filter(s => s.sex === 'F' && s.weightGrams >= 1500).map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.weightGrams}g)</option>
                      ))}
                    </select>
                  </div>
                </div>
                <button
                  onClick={() => {
                    const sId = document.getElementById('sireSelect').value;
                    const dId = document.getElementById('damSelect').value;
                    if (sId && dId) pairSnakes(sId, dId);
                    else alert('Select both an eligible sire and dam!');
                  }}
                  className="w-full py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold rounded-lg shadow"
                >
                  Pair & Lay Clutch
                </button>
              </div>
            )}

            {/* INCUBATOR */}
            {tab === 'incubator' && (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {eggs.map(e => (
                  <div key={e.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center text-xs flex flex-col justify-between">
                    <div className="text-3xl my-2">🥚</div>
                    <div className="font-mono text-slate-400 mb-1">{e.id}</div>
                    <div className="font-bold text-amber-400 font-mono mb-3">{e.daysLeft > 0 ? `${e.daysLeft}d Remaining` : 'PIPPED!'}</div>
                    {e.daysLeft <= 0 ? (
                      <button
                        onClick={() => {
                          const hatchling = resolveSpecimen(e.geno, Math.random() > 0.5 ? 'M' : 'F', 1, 65, 'MorphLab Hatchery', 1);
                          setSnakes(s => [...s, hatchling]);
                          setEggs(cur => cur.filter(x => x.id !== e.id));
                          audio.playCash();
                        }}
                        className="py-1.5 bg-amber-600 text-white font-bold rounded-lg"
                      >
                        Hatch Out
                      </button>
                    ) : (
                      <div className="text-[10px] text-slate-500 font-mono">Candled: Fertile</div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* 10-LANE AUCTION FLOOR */}
            {tab === 'auctions' && (
              <div className="space-y-3">
                <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs flex justify-between items-center">
                  <span className="font-bold text-slate-200">10-Lane Player Consignment Floor</span>
                  <span className="text-[10px] text-slate-400 font-mono">8% Broker Fee · Anti-Snipe Overtime</span>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                  {lanes.map(l => (
                    <div key={l.id} className={`p-2.5 rounded-xl border flex flex-col justify-between text-xs ${l.active ? 'bg-slate-900 border-emerald-500/60' : 'bg-slate-950/40 border-slate-800'}`}>
                      {l.active ? (
                        <div>
                          <div className="flex justify-between items-center text-[10px] font-mono text-slate-400 mb-1">
                            <span>LANE #{l.id + 1}</span>
                            <span className={l.timeLeft <= 10 ? 'text-red-400 font-bold' : 'text-slate-300'}>0:{l.timeLeft < 10 ? '0' + l.timeLeft : l.timeLeft}</span>
                          </div>
                          <div className="font-bold text-slate-100 truncate text-[11px] mb-1">{l.snake.name}</div>
                          <div className="bg-slate-950 p-1.5 rounded text-center my-1.5">
                            <div className="text-[9px] text-slate-500">HAMMER</div>
                            <div className="text-emerald-400 font-bold font-mono text-sm">${l.currentBid}</div>
                          </div>
                          <div className="text-[9px] text-slate-400 truncate">Bidder: <span className="text-cyan-400 font-bold">{l.highestBidder}</span></div>
                          {l.overtime && <div className="text-[8px] text-amber-400 font-bold mt-1">+15s Overtime</div>}
                        </div>
                      ) : (
                        <div className="py-8 text-center text-slate-600 font-mono text-[10px]">
                          <div>LANE #{l.id + 1}</div>
                          <div className="mt-1">EMPTY</div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* BARGAIN BINS (10S COUNTDOWN) */}
            {tab === 'bargains' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs">
                  <span className="font-bold text-slate-200">Distressed Liquidation Bins</span>
                  <span className="text-amber-400 font-mono font-bold">Refresh: {refreshTimer}s</span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {bargains.map(b => {
                    const price = Math.round(b.snake.baseValuation * (1 - b.discount / 100));
                    return (
                      <div key={b.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between text-[10px] mb-1">
                            <span className="bg-red-950 text-red-300 px-1.5 py-0.5 rounded font-bold">-{b.discount}% OFF</span>
                            <span className="text-slate-400 font-mono">${price}</span>
                          </div>
                          <div className="font-bold text-slate-100 text-sm">{b.snake.name}</div>
                          <div className="text-[11px] text-slate-300 italic my-2">"{b.snake.phenotypeDescription}"</div>
                        </div>
                        <button
                          disabled={bank < price || snakes.length >= maxCapacity}
                          onClick={() => {
                            setBank(c => c - price);
                            setSnakes(s => [...s, b.snake]);
                            setBargains(list => list.filter(i => i.id !== b.id));
                            audio.playCash();
                          }}
                          className="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 text-white font-bold rounded-lg text-xs"
                        >
                          Snatch Deal (${price})
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* BREEDER TRADES */}
            {tab === 'trades' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs">
                  <span className="font-bold text-slate-200">Breeder Trade Network</span>
                  <span className="text-purple-400 font-mono font-bold">Refresh: {refreshTimer}s</span>
                </div>
                {trades.map(t => {
                  const eligible = snakes.find(s => s.weightGrams >= t.minWeight);
                  return (
                    <div key={t.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs flex justify-between items-center">
                      <div>
                        <div className="font-bold text-cyan-400">{t.breeder}</div>
                        <div className="text-slate-300 font-semibold mt-0.5">Demanding: {t.criteria}</div>
                        <div className="text-[11px] text-slate-400 mt-1">Reward: <span className="text-purple-300 font-bold">{t.reward.name}</span> + ${t.cash}</div>
                      </div>
                      <button
                        disabled={!eligible}
                        onClick={() => {
                          setSnakes(s => [...s.filter(i => i.id !== eligible.id), t.reward]);
                          setBank(b => b + t.cash);
                          setTrades(list => list.filter(i => i.id !== t.id));
                          audio.playCash();
                        }}
                        className="px-3 py-2 bg-purple-600 disabled:bg-slate-800 text-white font-bold rounded-lg"
                      >
                        Trade
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {/* FEEDERS */}
            {tab === 'feeders' && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {FEEDER_SPECS.map(spec => (
                  <div key={spec.id} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-center text-xs">
                    <div className="text-slate-400 text-[10px] font-mono">{spec.name}</div>
                    <div className="text-lg font-bold font-mono text-white my-1">{freezer[spec.id] || 0}</div>
                    <button
                      disabled={bank < spec.cost * 5}
                      onClick={() => {
                        setBank(b => b - spec.cost * 5);
                        setFreezer(f => ({ ...f, [spec.id]: (f[spec.id] || 0) + 5 }));
                      }}
                      className="w-full py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[10px] font-bold"
                    >
                      Buy 5 (${spec.cost * 5})
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* ISOPOD LAB */}
            {tab === 'isopods' && (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {isopods.map(iso => (
                  <div key={iso.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between text-[10px] mb-1">
                        <span className="text-emerald-400 font-bold">{iso.rarity}</span>
                        <span className="text-slate-400 font-mono">{iso.pop} Count</span>
                      </div>
                      <div className="font-bold text-slate-100">{iso.name}</div>
                      <div className="text-[10px] text-slate-400 italic mb-2">{iso.sci}</div>
                      <div className="text-[11px] text-slate-300 bg-slate-950 p-2 rounded mb-2">{iso.buff}</div>
                    </div>
                    <button
                      disabled={iso.pop < 10}
                      onClick={() => {
                        setBank(b => b + iso.price);
                        setIsopods(cur => cur.map(i => i.id === iso.id ? { ...i, pop: i.pop - 5 } : i));
                        audio.playCash();
                      }}
                      className="w-full py-1.5 bg-emerald-600 disabled:bg-slate-800 text-white font-bold rounded-lg text-xs"
                    >
                      Sell Starter Pack (${iso.price})
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TECH TREE (UP TO 600 TUBS) */}
            {tab === 'tech' && (
              <div className="space-y-3">
                <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs">
                  <div className="font-bold text-slate-100 text-sm mb-1">Facility Expansion Ladder</div>
                  <div className="text-slate-400 text-[11px]">Hard capacity cap of 600 tubs.</div>
                </div>
                {FACILITY_TIERS.map(t => {
                  const owned = facilityTier >= t.tier;
                  const isNext = facilityTier + 1 === t.tier;
                  return (
                    <div key={t.tier} className={`p-3 rounded-xl border flex justify-between items-center text-xs ${owned ? 'bg-slate-950 border-emerald-900/40' : isNext ? 'bg-slate-900 border-amber-500/50' : 'bg-slate-950/40 border-slate-800 opacity-60'}`}>
                      <div>
                        <div className="font-bold text-slate-200">TIER {t.tier}: {t.name}</div>
                        <div className="text-emerald-400 font-mono text-[11px] font-bold">Capacity: {t.cap} Spaces</div>
                      </div>
                      {isNext && (
                        <button
                          disabled={bank < t.cost}
                          onClick={() => {
                            setBank(b => b - t.cost);
                            setFacilityTier(t.tier);
                            audio.playCash();
                          }}
                          className="px-3 py-1.5 bg-amber-600 disabled:bg-slate-800 text-white font-bold rounded-lg"
                        >
                          Upgrade (${t.cost.toLocaleString()})
                        </button>
                      )}
                      {owned && <span className="text-emerald-400 font-bold font-mono">ACTIVE</span>}
                    </div>
                  );
                })}

                <div className="pt-2">
                  <button
                    disabled={upgrades.includes('autofeeder') || bank < 2500}
                    onClick={() => {
                      setBank(b => b - 2500);
                      setUpgrades(u => [...u, 'autofeeder']);
                    }}
                    className={`w-full p-3 rounded-xl border text-xs font-bold text-left flex justify-between items-center ${
                      upgrades.includes('autofeeder') ? 'bg-slate-950 border-cyan-800 text-cyan-300' : 'bg-slate-900 border-slate-800 text-slate-200'
                    }`}
                  >
                    <div>
                      <div>⚡ Auto-Feeder Conveyor Logistics</div>
                      <div className="text-[10px] text-slate-400 font-normal">Automatically draws thawed feeders from inventory on daily tick.</div>
                    </div>
                    <span>{upgrades.includes('autofeeder') ? 'INSTALLED' : '$2,500'}</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Hidden Save Import Input */}
          <input type="file" id="importInput" onChange={importSave} accept=".json" className="hidden" />
          <footer className="mt-6 text-center text-[10px] text-slate-600 font-mono flex justify-center gap-3">
            <span onClick={() => document.getElementById('importInput').click()} className="cursor-pointer underline">Restore JSON Save</span>
            <span>·</span>
            <span>MorphLab v1.0</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MorphLabApp />);
  </script>
</body>
</html>
